<?xml version="1.0" encoding="UTF-8"?>
<!-- The Shiny mark, redrawn as a vector from shiny/art/appicon.png (360x360) so the app icon stays crisp at 1024px -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <defs>
    <linearGradient id="disc" x1="0" y1="0.3" x2="1" y2="0.7">
      <stop offset="0" stop-color="#FF6088"/>
      <stop offset="0.5" stop-color="#C83FCB"/>
      <stop offset="1" stop-color="#8228F8"/>
    </linearGradient>
    <linearGradient id="core" x1="0.05" y1="0.3" x2="0.95" y2="0.7">
      <stop offset="0" stop-color="#A2FF44"/>
      <stop offset="1" stop-color="#36DE48"/>
    </linearGradient>
    <linearGradient id="sun" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0" stop-color="#FFE83C"/>
      <stop offset="1" stop-color="#FFD426"/>
    </linearGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#FDA82F"/>
      <stop offset="1" stop-color="#FC8D26"/>
    </radialGradient>
  </defs>
  <circle cx="178.5" cy="182" r="126.5" fill="none" stroke="#7E46FF" stroke-width="8"/>
  <circle cx="178.5" cy="183" r="103.5" fill="url(#disc)"/>
  <circle cx="178.5" cy="183.5" r="48" fill="url(#core)"/>
  <circle cx="233.5" cy="124.5" r="14" fill="#F5D1FF" stroke="#D88AF0" stroke-width="1"/>
  <circle cx="108.5" cy="256" r="33.5" fill="url(#sun)"/>
  <circle cx="290" cy="79" r="37" fill="url(#star)"/>
  <!-- four-point sparkle -->
  <path fill="#FFD91D" d="M290 42 C294 67 302 75 327 79 C302 83 294 91 290 116 C286 91 278 83 253 79 C278 75 286 67 290 42 Z"/>
</svg>
